# docker-compose.airgap.yml
# Air-gap overlay: overrides the standard docker-compose.yml so that
# pre-loaded Docker images are used directly without pulling from a registry
# or building from source.

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    container_name: inquiry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inquiry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: inquiry-backend
    pull_policy: never
    build: {}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: inquiry-frontend
    pull_policy: never
    build: {}

networks:
  shared-net:
    external: false
