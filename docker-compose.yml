services:
  backend:
    build:
      context: ./backend
    image: inquiry-backend
    container_name: inquiry-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/inquiry
      SECRET_KEY: replace-this-secret-key-in-production
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:9000"]'
    ports:
      - "8000:8000"
    networks:
      - default
      - shared-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: inquiry-frontend
    container_name: inquiry-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9000:80"
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default: {}
  shared-net:
    external: true
